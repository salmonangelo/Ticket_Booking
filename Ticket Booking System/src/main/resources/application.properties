# ===================================================================
# Application Configuration - Ticket Booking System
# ===================================================================
spring.application.name=ticket-booking-system
server.port=8080

# ===================================================================
# Database Configuration (XAMPP MySQL / phpMyAdmin)
# Default XAMPP settings: host=localhost, port=3306, user=root, password=""
# "createDatabaseIfNotExist=true" will automatically create the database
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3307/ticket_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# Web & Static Content Configuration
# ===================================================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

